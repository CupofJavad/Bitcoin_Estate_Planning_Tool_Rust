worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # Writable temp paths for read-only container operation
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Structured access log to stdout
    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Edge rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/s;

    upstream legacy_vault_api {
        server api:8000;
        keepalive 32;
    }

    upstream legacy_vault_frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Global security headers at edge
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Shared proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Auth endpoints (stricter edge burst protection)
        location /auth/ {
            limit_req zone=auth_zone burst=30 nodelay;
            proxy_pass http://legacy_vault_api;
        }

        # Backend API & OpenAPI endpoints
        location /api/ {
            limit_req zone=api_zone burst=100 nodelay;
            proxy_pass http://legacy_vault_api;
        }

        # Health, readiness, version, Prometheus metrics, and API docs
        location = /health  { proxy_pass http://legacy_vault_api; }
        location = /ready   { proxy_pass http://legacy_vault_api; }
        location = /version { proxy_pass http://legacy_vault_api; }
        location = /metrics { proxy_pass http://legacy_vault_api; }
        location = /docs    { proxy_pass http://legacy_vault_api; }

        # Immutable Next.js static assets
        location /_next/static/ {
            proxy_pass http://legacy_vault_frontend;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Next.js frontend application
        location / {
            proxy_pass http://legacy_vault_frontend;
        }
    }
}
